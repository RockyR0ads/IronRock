<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap');
    body { margin: 0; font-family: Inter, system-ui, sans-serif; }
    a { color: #FF5247; } a:hover { color: #CA463B; }
  </style>
</helmet>

<div style="width: 560px; height: 420px; box-sizing: border-box; background:
    radial-gradient(120% 70% at 24% -10%, #1a1c22 0%, #0e0f12 58%);
    padding: 40px; display: flex; flex-direction: column; gap: 26px; color: #F2F1EC;
    font-family: Inter, system-ui, sans-serif; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 10px;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
        letter-spacing: 0.22em; color: #2DD4BF; text-transform: uppercase;">Direction H</span>
    <span style="height: 1px; flex-grow: 1; background: #2A2E35;"></span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
        letter-spacing: 0.18em; color: #646A73; text-transform: uppercase;">Heritage emblem</span>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 22px;">
    <div style="width: 116px; height: 116px; border-radius: 26px;
        background: linear-gradient(157deg, #FF5247 0%, #CA463B 100%);
        box-shadow: 0 12px 30px -12px rgba(255,82,71,0.55), inset 0 1px 0 rgba(255,255,255,0.18);
        display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 128 128" width="106" height="106" aria-hidden="true">
        <defs>
          <path id="topArc" d="M 24 64 A 40 40 0 0 1 104 64" fill="none"></path>
          <path id="botArc" d="M 26 64 A 38 38 0 0 0 102 64" fill="none"></path>
        </defs>
        <circle cx="64" cy="64" r="52" fill="none" stroke="#14161A" stroke-width="3"></circle>
        <circle cx="64" cy="64" r="45" fill="none" stroke="#14161A" stroke-width="1.4" opacity="0.6"></circle>
        <text font-family="Archivo, sans-serif" font-weight="800" font-size="13"
            letter-spacing="2.5" fill="#14161A">
          <textPath href="#topArc" startOffset="50%" text-anchor="middle">IRON &middot; ROCK</textPath>
        </text>
        <text font-family="'JetBrains Mono', monospace" font-weight="600" font-size="8"
            letter-spacing="3" fill="#14161A">
          <textPath href="#botArc" startOffset="50%" text-anchor="middle">STRENGTH LOG</textPath>
        </text>
        <!-- central barbell -->
        <rect x="40" y="61" width="48" height="6" rx="3" fill="#14161A"></rect>
        <rect x="44" y="53" width="7" height="22" rx="2.5" fill="#14161A"></rect>
        <rect x="53" y="49" width="7" height="30" rx="2.5" fill="#14161A"></rect>
        <rect x="68" y="49" width="7" height="30" rx="2.5" fill="#14161A"></rect>
        <rect x="77" y="53" width="7" height="22" rx="2.5" fill="#14161A"></rect>
        <circle cx="30" cy="64" r="2.4" fill="#14161A"></circle>
        <circle cx="98" cy="64" r="2.4" fill="#14161A"></circle>
      </svg>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 11px;
        background: linear-gradient(157deg, #FF5247 0%, #CA463B 100%);
        display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 128 128" width="40" height="40" aria-hidden="true">
        <rect x="34" y="60" width="60" height="8" rx="4" fill="#14161A"></rect>
        <rect x="40" y="49" width="9" height="30" rx="3" fill="#14161A"></rect>
        <rect x="53" y="44" width="9" height="40" rx="3" fill="#14161A"></rect>
        <rect x="66" y="44" width="9" height="40" rx="3" fill="#14161A"></rect>
        <rect x="79" y="49" width="9" height="30" rx="3" fill="#14161A"></rect>
      </svg>
    </div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em;
        color: #646A73; text-transform: uppercase; padding-bottom: 4px;">emblem &middot; favicon</span>
  </div>

  <div style="display: flex; align-items: center; gap: 14px; margin-top: 2px;">
    <svg viewBox="0 0 128 128" width="42" height="42" aria-hidden="true">
      <circle cx="64" cy="64" r="52" fill="none" stroke="#F2F1EC" stroke-width="4"></circle>
      <rect x="42" y="61" width="44" height="6" rx="3" fill="#FF5247"></rect>
      <rect x="46" y="53" width="7" height="22" rx="2.5" fill="#FF5247"></rect>
      <rect x="55" y="49" width="7" height="30" rx="2.5" fill="#FF5247"></rect>
      <rect x="66" y="49" width="7" height="30" rx="2.5" fill="#FF5247"></rect>
      <rect x="75" y="53" width="7" height="22" rx="2.5" fill="#FF5247"></rect>
    </svg>
    <span style="font-family: Archivo, sans-serif; font-weight: 900; font-size: 33px;
        letter-spacing: -1.5px; color: #F2F1EC; text-transform: uppercase;">Ironrock</span>
  </div>

  <p style="margin: auto 0 0; font-size: 12.5px; line-height: 1.5; color: #9AA0A8; max-width: 470px;">
    A round club-patch crest &mdash; barbell in the middle, name curved around it. Heritage, earned, collectible.
    <span style="color:#646A73;">Trade-off: detail gets lost small; favicon needs the bare barbell.</span>
  </p>
</div>
</x-dc>
</body>
</html>
