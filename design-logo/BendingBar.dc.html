<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap');
    body { margin: 0; font-family: Inter, system-ui, sans-serif; }
    a { color: #FF5247; } a:hover { color: #CA463B; }
  </style>
</helmet>

<div style="width: 560px; height: 420px; box-sizing: border-box; background:
    radial-gradient(120% 70% at 24% -10%, #1a1c22 0%, #0e0f12 58%);
    padding: 40px; display: flex; flex-direction: column; gap: 26px; color: #F2F1EC;
    font-family: Inter, system-ui, sans-serif; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 10px;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
        letter-spacing: 0.22em; color: #2DD4BF; text-transform: uppercase;">Direction C</span>
    <span style="height: 1px; flex-grow: 1; background: #2A2E35;"></span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
        letter-spacing: 0.18em; color: #646A73; text-transform: uppercase;">Loaded bar</span>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 22px;">
    <div style="width: 116px; height: 116px; border-radius: 26px;
        background: linear-gradient(157deg, #FF5247 0%, #CA463B 100%);
        box-shadow: 0 12px 30px -12px rgba(255,82,71,0.55), inset 0 1px 0 rgba(255,255,255,0.18);
        display: flex; align-items: center; justify-content: center;">
      <!-- the app's bending barbell, knocked out of the tile -->
      <svg viewBox="0 0 256 120" width="88" fill="#14161A" aria-hidden="true">
        <path d="M16 60 Q128 46 240 60" fill="none" stroke="#14161A" stroke-width="9" stroke-linecap="round"></path>
        <rect x="84" y="47" width="7" height="26" rx="2.5"></rect>
        <rect x="165" y="47" width="7" height="26" rx="2.5"></rect>
        <rect x="66" y="26" width="15" height="68" rx="5"></rect>
        <rect x="47" y="34" width="13" height="52" rx="4.5"></rect>
        <rect x="31" y="41" width="11" height="38" rx="4"></rect>
        <rect x="175" y="26" width="15" height="68" rx="5"></rect>
        <rect x="196" y="34" width="13" height="52" rx="4.5"></rect>
        <rect x="214" y="41" width="11" height="38" rx="4"></rect>
      </svg>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 11px;
        background: linear-gradient(157deg, #FF5247 0%, #CA463B 100%);
        display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 256 120" width="34" fill="#14161A" aria-hidden="true">
        <path d="M16 60 Q128 46 240 60" fill="none" stroke="#14161A" stroke-width="11" stroke-linecap="round"></path>
        <rect x="66" y="26" width="15" height="68" rx="5"></rect>
        <rect x="47" y="34" width="13" height="52" rx="4.5"></rect>
        <rect x="31" y="41" width="11" height="38" rx="4"></rect>
        <rect x="175" y="26" width="15" height="68" rx="5"></rect>
        <rect x="196" y="34" width="13" height="52" rx="4.5"></rect>
        <rect x="214" y="41" width="11" height="38" rx="4"></rect>
      </svg>
    </div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em;
        color: #646A73; text-transform: uppercase; padding-bottom: 4px;">icon &middot; favicon</span>
  </div>

  <!-- lockup: bar underscores the word -->
  <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 2px;">
    <span style="font-family: Archivo, sans-serif; font-weight: 900; font-size: 33px;
        letter-spacing: -1.5px; color: #F2F1EC; text-transform: uppercase; line-height: 1;">Ironrock</span>
    <svg viewBox="0 0 256 40" width="176" fill="#FF5247" aria-hidden="true">
      <path d="M8 22 Q128 12 248 22" fill="none" stroke="#FF5247" stroke-width="5" stroke-linecap="round"></path>
      <rect x="70" y="10" width="9" height="26" rx="3"></rect>
      <rect x="54" y="14" width="8" height="18" rx="3"></rect>
      <rect x="177" y="10" width="9" height="26" rx="3"></rect>
      <rect x="194" y="14" width="8" height="18" rx="3"></rect>
    </svg>
  </div>

  <p style="margin: auto 0 0; font-size: 12.5px; line-height: 1.5; color: #9AA0A8; max-width: 470px;">
    Builds on the loaded barbell already in the app &mdash; a bar bowing under weight, all motion and load.
    <span style="color:#646A73;">Trade-off: busiest at favicon size; needs the simplified small cut shown.</span>
  </p>
</div>
</x-dc>
</body>
</html>
