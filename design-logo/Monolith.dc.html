<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap');
    body { margin: 0; font-family: Inter, system-ui, sans-serif; }
    a { color: #FF5247; } a:hover { color: #CA463B; }
  </style>
</helmet>

<div style="width: 560px; height: 420px; box-sizing: border-box; background:
    radial-gradient(120% 70% at 24% -10%, #1a1c22 0%, #0e0f12 58%);
    padding: 40px; display: flex; flex-direction: column; gap: 26px; color: #F2F1EC;
    font-family: Inter, system-ui, sans-serif; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 10px;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
        letter-spacing: 0.22em; color: #2DD4BF; text-transform: uppercase;">Direction D</span>
    <span style="height: 1px; flex-grow: 1; background: #2A2E35;"></span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
        letter-spacing: 0.18em; color: #646A73; text-transform: uppercase;">Monolith &middot; stone</span>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 22px;">
    <!-- graphite tile: the "not everything red" stance; accent as the iron vein -->
    <div style="width: 116px; height: 116px; border-radius: 26px;
        background: linear-gradient(157deg, #2A2E35 0%, #14161A 100%);
        box-shadow: 0 12px 30px -14px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
        display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 128 128" width="104" height="104" aria-hidden="true">
        <!-- faceted boulder -->
        <polygon points="30,88 20,54 47,29 85,25 108,53 95,95 58,102" fill="#363B43"></polygon>
        <polygon points="47,29 85,25 108,53 74,60" fill="#454B54"></polygon>
        <polygon points="74,60 108,53 95,95 58,102" fill="#2A2E35"></polygon>
        <polygon points="30,88 47,29 74,60 58,102" fill="#31363D"></polygon>
        <!-- iron vein -->
        <path d="M62 27 L54 58 L67 74 L58 100" fill="none" stroke="#FF5247"
            stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" opacity="0.92"></path>
      </svg>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 11px;
        background: linear-gradient(157deg, #2A2E35 0%, #14161A 100%);
        display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 128 128" width="40" height="40" aria-hidden="true">
        <polygon points="30,88 20,54 47,29 85,25 108,53 95,95 58,102" fill="#363B43"></polygon>
        <polygon points="74,60 108,53 95,95 58,102" fill="#2A2E35"></polygon>
        <path d="M62 27 L54 58 L67 74 L58 100" fill="none" stroke="#FF5247"
            stroke-width="4.5" stroke-linecap="round" opacity="0.95"></path>
      </svg>
    </div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em;
        color: #646A73; text-transform: uppercase; padding-bottom: 4px;">icon &middot; favicon</span>
  </div>

  <!-- lockup: weight split between IRON and ROCK -->
  <div style="display: flex; align-items: baseline; gap: 1px; margin-top: 2px;
      font-family: Archivo, sans-serif; letter-spacing: -1.5px; text-transform: uppercase;">
    <span style="font-weight: 900; font-size: 33px; color: #F2F1EC;">Iron</span>
    <span style="font-weight: 700; font-size: 33px; color: #9AA0A8;">rock</span>
  </div>

  <p style="margin: auto 0 0; font-size: 12.5px; line-height: 1.5; color: #9AA0A8; max-width: 470px;">
    Leans on the <strong style="color:#F2F1EC; font-weight:600;">rock</strong> half &mdash; a chiselled stone
    with an iron vein, on graphite instead of red.
    <span style="color:#646A73;">Trade-off: the answer to &ldquo;not everything red,&rdquo; but least obviously a gym.</span>
  </p>
</div>
</x-dc>
</body>
</html>
