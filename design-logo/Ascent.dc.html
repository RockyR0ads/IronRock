<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap');
    body { margin: 0; font-family: Inter, system-ui, sans-serif; }
    a { color: #FF5247; } a:hover { color: #CA463B; }
  </style>
</helmet>

<div style="width: 560px; height: 420px; box-sizing: border-box; background:
    radial-gradient(120% 70% at 24% -10%, #1a1c22 0%, #0e0f12 58%);
    padding: 40px; display: flex; flex-direction: column; gap: 26px; color: #F2F1EC;
    font-family: Inter, system-ui, sans-serif; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 10px;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
        letter-spacing: 0.22em; color: #2DD4BF; text-transform: uppercase;">Direction G</span>
    <span style="height: 1px; flex-grow: 1; background: #2A2E35;"></span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
        letter-spacing: 0.18em; color: #646A73; text-transform: uppercase;">Ascent &middot; the stack</span>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 22px;">
    <div style="width: 116px; height: 116px; border-radius: 26px;
        background: linear-gradient(157deg, #FF5247 0%, #CA463B 100%);
        box-shadow: 0 12px 30px -12px rgba(255,82,71,0.55), inset 0 1px 0 rgba(255,255,255,0.18);
        display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 128 128" width="104" height="104" aria-hidden="true">
        <!-- plates stacked into a rising summit -->
        <rect x="26" y="80" width="76" height="13" rx="6.5" fill="#14161A"></rect>
        <rect x="40" y="61" width="48" height="13" rx="6.5" fill="#14161A"></rect>
        <rect x="52" y="42" width="24" height="13" rx="6.5" fill="#14161A"></rect>
      </svg>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 11px;
        background: linear-gradient(157deg, #FF5247 0%, #CA463B 100%);
        display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 128 128" width="40" height="40" aria-hidden="true">
        <rect x="26" y="80" width="76" height="14" rx="7" fill="#14161A"></rect>
        <rect x="40" y="60" width="48" height="14" rx="7" fill="#14161A"></rect>
        <rect x="52" y="40" width="24" height="14" rx="7" fill="#14161A"></rect>
      </svg>
    </div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em;
        color: #646A73; text-transform: uppercase; padding-bottom: 4px;">icon &middot; favicon</span>
  </div>

  <div style="display: flex; align-items: center; gap: 13px; margin-top: 2px;">
    <svg viewBox="0 0 60 44" width="40" aria-hidden="true">
      <rect x="4" y="30" width="52" height="8" rx="4" fill="#FF5247"></rect>
      <rect x="14" y="18" width="32" height="8" rx="4" fill="#FF5247"></rect>
      <rect x="22" y="6" width="16" height="8" rx="4" fill="#FF5247"></rect>
    </svg>
    <span style="font-family: Archivo, sans-serif; font-weight: 900; font-size: 33px;
        letter-spacing: -1.5px; color: #F2F1EC; text-transform: uppercase;">Ironrock</span>
  </div>

  <p style="margin: auto 0 0; font-size: 12.5px; line-height: 1.5; color: #9AA0A8; max-width: 470px;">
    Plates stacked into a rising summit &mdash; the app is about progression, so the mark climbs.
    <span style="color:#646A73;">Trade-off: most abstract; reads as &ldquo;up&rdquo; before it reads as &ldquo;iron.&rdquo;</span>
  </p>
</div>
</x-dc>
</body>
</html>
