<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap');
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #0E0F12; }
    a { color: #2DD4BF; } a:hover { color: #14B8A6; }
    .crow { display: flex; align-items: center; gap: 7px; padding: 4px 8px; border-radius: 10px; }
    .chip { display: flex; align-items: center; justify-content: center; height: 42px; border-radius: 9px; background: #1E2127;
      font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; color: #F2F1EC; }
    .ckg { flex: 1; min-width: 0; }
    .creps { flex: 0 0 3.75rem; }
    .crpe { flex: 0 0 2.9rem; }
    .cnum { width: 22px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #646A73; flex-shrink: 0; }
    .cdone { width: 42px; height: 42px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .h { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #646A73; text-align: center; }
    .nb { background: none; border: none; cursor: pointer; padding: 0; width: 34px; height: 42px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  </style>
</helmet>

<div style="width: 404px; box-sizing: border-box; background: #0E0F12; padding: 16px; color: #F2F1EC;">
  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.18em; color: #2DD4BF; text-transform: uppercase;">D · Inline chips</span>
    <span style="flex: 1; height: 1px; background: #2A2E35;"></span>
  </div>
  <p style="margin: 0 0 14px; font-size: 11.5px; line-height: 1.45; color: #646A73;">Bigger tap targets, one check per done set, done rows settled to a single colour, and the focused cell shown while editing. <span style="color: #9AA0A8;">Header area left as-is.</span></p>

  <div style="background: #16181C; border: 1px solid #2A2E35; border-radius: 16px; padding: 16px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="width: 10px; height: 10px; border-radius: 50%; background: #FF5247; flex-shrink: 0;"></span>
      <span style="font-family: Archivo, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: -0.01em;">Bench press</span>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" style="flex-shrink:0;"><path d="M9 5l7 7-7 7" stroke="#646A73" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="flex: 1;"></span>
      <span style="flex-shrink: 0; border-radius: 999px; padding: 4px 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; background: #1E2127; color: #9AA0A8;">1/4</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #9AA0A8;">4 × 5</span>
      <span style="border-radius: 6px; padding: 1px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; background: rgba(255,82,71,0.15); color: #FF5247;">RPE 8</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #646A73;">last 100 × 5 @8</span>
    </div>

    <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 4px;">
      <!-- one column header -->
      <div class="crow" style="padding-top: 0; padding-bottom: 0;">
        <span class="cnum"></span>
        <span style="width: 34px; flex-shrink: 0;"></span>
        <span class="h ckg">kg</span>
        <span class="h creps">reps</span>
        <span class="h crpe">rpe</span>
        <span class="h" style="width: 42px; flex-shrink: 0;">done</span>
      </div>
      <!-- warm-up done (settles to blue) -->
      <div class="crow" style="background: rgba(76,141,240,0.07);">
        <span class="cnum" style="color: #4C8DF0;">W</span>
        <button class="nb"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M5 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-4 3v-3H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" stroke="#646A73" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
        <span class="chip ckg" style="background: rgba(76,141,240,0.15); color: #7FB0F5;">40</span>
        <span class="chip creps" style="background: rgba(76,141,240,0.15); color: #7FB0F5;">10</span>
        <span class="chip crpe" style="background: transparent;"></span>
        <span class="cdone" style="background: #4C8DF0; color: #0E0F12;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <!-- set 1 done (settles to one green — RPE muted into it, number kept, single check) -->
      <div class="crow" style="background: rgba(65,194,119,0.07);">
        <span class="cnum" style="color: #41C277;">1</span>
        <button class="nb" style="color:#2DD4BF;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M5 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-4 3v-3H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7.5 8.5h9M7.5 11.5h5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <span class="chip ckg" style="background: rgba(65,194,119,0.15); color: #41C277;">100</span>
        <span class="chip creps" style="background: rgba(65,194,119,0.15); color: #41C277;">5</span>
        <span class="chip crpe" style="background: rgba(65,194,119,0.15); color: #41C277;">8</span>
        <span class="cdone" style="background: #41C277; color: #0E0F12;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <!-- set 2 active — full-row outline, focused cell shown by caret -->
      <div class="crow" style="background: #1E2127; box-shadow: inset 0 0 0 1.5px #2DD4BF;">
        <span class="cnum" style="color: #2DD4BF;">2</span>
        <button class="nb"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M5 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-4 3v-3H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" stroke="#646A73" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
        <span class="chip ckg" style="background: #23262C;">100<span style="width:2px;height:19px;background:#2DD4BF;margin-left:2px;border-radius:1px;"></span></span>
        <span class="chip creps" style="background: #262A31;">5</span>
        <span class="chip crpe" style="background: rgba(240,162,75,0.14); color: #F0B366;">8</span>
        <span class="cdone" style="border: 1.5px solid #363B43; color: #646A73;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" style="opacity:.4;"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <!-- set 3 empty -->
      <div class="crow">
        <span class="cnum">3</span>
        <button class="nb"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M5 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-4 3v-3H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" stroke="#646A73" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
        <span class="chip ckg" style="color: #646A73; font-weight: 400;">–</span>
        <span class="chip creps">5</span>
        <span class="chip crpe" style="background: rgba(240,162,75,0.1); color: rgba(240,179,102,0.7);">8</span>
        <span class="cdone" style="border: 1px solid #363B43; color: #646A73;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" style="opacity:.35;"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
    </div>

    <div style="margin-top: 14px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #2A2E35; padding-top: 12px;">
      <span style="flex: 3; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; background: rgba(45,212,191,0.15); padding: 9px 12px; font-size: 13px; font-weight: 600; color: #2DD4BF;">+ Add set</span>
      <span style="flex: 2; display: flex; align-items: center; justify-content: center; gap: 4px; border-radius: 8px; border: 1px solid rgba(240,190,75,0.3); background: rgba(240,190,75,0.1); padding: 9px; font-size: 12px; font-weight: 600; color: #F0BE4B;">+ Warm-up</span>
      <span style="width: 40px; height: 40px; border-radius: 8px; background: #1E2127; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M4 8h13l-3-3M20 16H7l3 3" stroke="#9AA0A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span style="width: 40px; height: 40px; border-radius: 8px; background: #1E2127; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13" stroke="#FF5247" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
