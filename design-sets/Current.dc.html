<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap');
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #0E0F12; }
    a { color: #2DD4BF; } a:hover { color: #14B8A6; }
    .cell { height: 40px; border-radius: 8px; border: 1px solid #363B43; background: #1E2127;
      display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; color: #F2F1EC; }
    .hd { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase; color: #646A73; text-align: center; }
  </style>
</helmet>

<div style="width: 404px; box-sizing: border-box; background: #0E0F12; padding: 16px; color: #F2F1EC;">
  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.18em; color: #9AA0A8; text-transform: uppercase;">Current</span>
    <span style="flex: 1; height: 1px; background: #2A2E35;"></span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: #646A73; text-transform: uppercase;">as shipped</span>
  </div>

  <!-- exact current card -->
  <div style="background: #16181C; border: 1px solid #2A2E35; border-radius: 16px; padding: 16px;">
    <!-- header -->
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="width: 10px; height: 10px; border-radius: 50%; background: #FF5247; flex-shrink: 0;"></span>
      <span style="font-family: Archivo, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: -0.01em;">Bench press</span>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" style="flex-shrink:0;"><path d="M9 5l7 7-7 7" stroke="#646A73" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="flex: 1;"></span>
      <svg viewBox="0 0 130 24" height="16" width="120" fill="#646A73" style="opacity:.9;"><rect x="6" y="10" width="118" height="4" rx="2"/><rect x="18" y="4" width="6" height="16" rx="1.5"/><rect x="27" y="6" width="5" height="12" rx="1.5"/><rect x="98" y="4" width="6" height="16" rx="1.5"/><rect x="106" y="6" width="5" height="12" rx="1.5"/></svg>
      <span style="flex-shrink: 0; border-radius: 999px; padding: 4px 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; background: #1E2127; color: #9AA0A8;">1/4</span>
    </div>
    <!-- prescription -->
    <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #9AA0A8;">4 × 5</span>
      <span style="border-radius: 6px; padding: 1px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; background: rgba(255,82,71,0.15); color: #FF5247;">RPE 8</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #646A73;">target 100 kg</span>
    </div>
    <div style="margin-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #646A73;">Last 100 kg × 5 @ RPE 8</div>

    <!-- sets grid -->
    <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: grid; grid-template-columns: 1.9rem 1.6rem 1fr 3.25rem 3.5rem 2.5rem; gap: 8px; padding: 0 4px;">
        <span class="hd">Set</span><span></span><span class="hd">kg</span><span class="hd">reps</span><span class="hd">rpe</span><span class="hd">done</span>
      </div>
      <!-- warm-up (done, blue heat) -->
      <div style="display: grid; grid-template-columns: 1.9rem 1.6rem 1fr 3.25rem 3.5rem 2.5rem; gap: 8px; align-items: center;">
        <span style="text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #4C8DF0;">W</span>
        <span style="display:flex;justify-content:center;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M5 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-4 3v-3H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" stroke="#646A73" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
        <span class="cell" style="border-color: transparent; background: rgba(76,141,240,0.3); color: #7FB0F5;">40</span>
        <span class="cell" style="border-color: transparent; background: rgba(76,141,240,0.3); color: #7FB0F5;">10</span>
        <span class="cell" style="border-color: transparent; background: rgba(76,141,240,0.3); color: #7FB0F5;">–</span>
        <span style="justify-self: center; width: 36px; height: 36px; border-radius: 8px; background: #4C8DF0; color: #0E0F12; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <!-- set 1 done (green) -->
      <div style="display: grid; grid-template-columns: 1.9rem 1.6rem 1fr 3.25rem 3.5rem 2.5rem; gap: 8px; align-items: center;">
        <span style="text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #646A73;">1</span>
        <span style="display:flex;justify-content:center;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M5 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-4 3v-3H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" stroke="#646A73" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
        <span class="cell" style="border-color: transparent; background: rgba(65,194,119,0.3); color: #41C277;">100</span>
        <span class="cell" style="border-color: transparent; background: rgba(65,194,119,0.3); color: #41C277;">5</span>
        <span class="cell" style="border-color: rgba(240,160,75,0.5); background: rgba(240,160,75,0.28); color: #F0B366;">8</span>
        <span style="justify-self: center; width: 36px; height: 36px; border-radius: 8px; background: #41C277; color: #0E0F12; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <!-- set 2 active -->
      <div style="display: grid; grid-template-columns: 1.9rem 1.6rem 1fr 3.25rem 3.5rem 2.5rem; gap: 8px; align-items: center;">
        <span style="text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #646A73;">2</span>
        <span style="display:flex;justify-content:center;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M5 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-4 3v-3H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" stroke="#646A73" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
        <span class="cell" style="border-color: #2DD4BF; box-shadow: 0 0 0 2px rgba(45,212,191,0.35);">100</span>
        <span class="cell">5</span>
        <span class="cell" style="border-color: rgba(240,160,75,0.4); background: rgba(240,160,75,0.14); color: #F0B366;">8</span>
        <span style="justify-self: center; width: 36px; height: 36px; border-radius: 8px; border: 1px solid #363B43; background: #1E2127; color: #646A73; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" style="opacity:.4;"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <!-- set 3 empty -->
      <div style="display: grid; grid-template-columns: 1.9rem 1.6rem 1fr 3.25rem 3.5rem 2.5rem; gap: 8px; align-items: center;">
        <span style="text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #646A73;">3</span>
        <span style="display:flex;justify-content:center;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M5 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-4 3v-3H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" stroke="#646A73" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
        <span class="cell" style="color: #646A73; font-weight: 400;">–</span>
        <span class="cell">5</span>
        <span class="cell" style="border-color: rgba(240,160,75,0.4); background: rgba(240,160,75,0.14); color: #F0B366;">8</span>
        <span style="justify-self: center; width: 36px; height: 36px; border-radius: 8px; border: 1px solid #363B43; background: #1E2127; color: #646A73; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" style="opacity:.4;"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
    </div>

    <!-- actions -->
    <div style="margin-top: 12px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #2A2E35; padding-top: 12px;">
      <span style="flex: 3; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; background: rgba(45,212,191,0.15); padding: 8px 12px; font-size: 13px; font-weight: 600; color: #2DD4BF;">+ Add set</span>
      <span style="flex: 2; display: flex; align-items: center; justify-content: center; gap: 4px; border-radius: 8px; border: 1px solid rgba(240,190,75,0.3); background: rgba(240,190,75,0.1); padding: 8px; font-size: 12px; font-weight: 600; color: #F0BE4B;">+ Warm-up</span>
      <span style="width: 36px; height: 36px; border-radius: 8px; background: #1E2127; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M4 8h13l-3-3M20 16H7l3 3" stroke="#9AA0A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span style="width: 36px; height: 36px; border-radius: 8px; background: #1E2127; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13" stroke="#FF5247" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
